<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f4a3a"/>
      <stop offset="100%" stop-color="#1c2e24"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="200" height="200" fill="url(#bg)"/>

  <!-- distant mountain -->
  <polygon points="10,120 75,45 120,120" fill="#3f5c48"/>
  <polygon points="60,120 100,60 140,120" fill="#4a6b53"/>
  <polygon points="75,52 90,72 100,60 110,75 120,120 60,120" fill="#e9f2ee" opacity="0.55"/>

  <!-- pine trees flanking the cabin -->
  <g fill="#16281f">
    <polygon points="26,150 40,110 54,150"/>
    <polygon points="30,160 40,128 50,160"/>
    <rect x="37" y="158" width="6" height="10"/>
  </g>
  <g fill="#16281f">
    <polygon points="146,150 160,110 174,150"/>
    <polygon points="150,160 160,128 170,160"/>
    <rect x="157" y="158" width="6" height="10"/>
  </g>

  <!-- ground -->
  <ellipse cx="100" cy="176" rx="95" ry="18" fill="#3a5a3f"/>

  <!-- cabin walls -->
  <rect x="48" y="118" width="104" height="58" rx="2" fill="#8a5a35"/>
  <rect x="48" y="130" width="104" height="4" fill="#a06b40"/>
  <rect x="48" y="144" width="104" height="4" fill="#a06b40"/>
  <rect x="48" y="158" width="104" height="4" fill="#a06b40"/>

  <!-- roof -->
  <polygon points="100,78 36,124 164,124" fill="#6b3f26"/>
  <polygon points="100,78 36,124 52,124" fill="#7a4a2e"/>
  <rect x="34" y="120" width="132" height="8" rx="2" fill="#4a2c1a"/>

  <!-- chimney -->
  <rect x="126" y="86" width="16" height="36" fill="#7a7a7a"/>
  <rect x="124" y="84" width="20" height="7" fill="#606060"/>
  <circle cx="140" cy="70" r="7" fill="#e9e9e9" opacity="0.85"/>
  <circle cx="148" cy="58" r="9" fill="#e9e9e9" opacity="0.7"/>
  <circle cx="150" cy="44" r="10" fill="#e9e9e9" opacity="0.55"/>

  <!-- window -->
  <rect x="63" y="136" width="20" height="20" rx="2" fill="#ffce7a" stroke="#4a2c1a" stroke-width="3"/>
  <line x1="73" y1="136" x2="73" y2="156" stroke="#4a2c1a" stroke-width="2"/>
  <line x1="63" y1="146" x2="83" y2="146" stroke="#4a2c1a" stroke-width="2"/>

  <!-- door -->
  <rect x="108" y="140" width="24" height="36" rx="3" fill="#4a2c1a"/>
  <circle cx="127" cy="159" r="2.2" fill="#ffce7a"/>
</svg>
